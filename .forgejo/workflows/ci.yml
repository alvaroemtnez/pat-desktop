# Builds the Flatpak bundle and the AppImage on every push and pull request.
# Needs a runner with the `docker` label that allows privileged containers
# (flatpak-builder uses bubblewrap). See docs/RELEASING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flatpak:
    runs-on: docker
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      # The image ships the GNOME 51 Platform and SDK. Letting flatpak-builder
      # install dependencies would also update them, with related extensions
      # (locales, codecs, the host's GPU drivers): gigabytes of downloads, and
      # updates fail inside the image's layers ("Invalid cross-device link").
      # Install only the missing Go extension, matching GNOME 51's 26.08 base.
      - name: Install the Go SDK extension
        run: |
          flatpak install -y --noninteractive --no-related flathub \
            org.freedesktop.Sdk.Extension.golang//26.08

      - name: Build
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
          FLATPAK_INSTALL_DEPS: ''
        run: tools/build-flatpak.sh dist

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: flatpak
          path: dist/

  appimage:
    runs-on: docker
    container:
      image: docker.io/library/golang:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq python3 file > /dev/null
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Check Python sources
        run: python3 -m py_compile pat_desktop/*.py tools/*.py

      - name: Build
        run: tools/build-appimage.sh dist

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: appimage
          path: dist/
