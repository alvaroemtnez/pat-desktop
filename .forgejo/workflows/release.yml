# On a vX.Y.Z tag: build the Flatpak bundle and the AppImage, and publish a
# Forgejo release with both, a SHA256SUMS file, and the CHANGELOG.md section
# of that version as release notes.
#
# Prepare the tag with tools/bump-version.py; see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  flatpak:
    runs-on: docker
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Build
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: tools/build-flatpak.sh dist

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: flatpak
          path: dist/

  appimage:
    runs-on: docker
    container:
      image: docker.io/library/golang:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq python3 file > /dev/null
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Check version consistency
        run: python3 tools/changelog.py check "${{ github.ref_name }}"

      - name: Build
        run: tools/build-appimage.sh dist

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: appimage
          path: dist/

  release:
    needs: [flatpak, appimage]
    runs-on: docker
    container:
      image: docker.io/library/golang:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: flatpak
          path: dist/
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: appimage
          path: dist/

      - name: Publish release
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum *.flatpak *.AppImage > SHA256SUMS && cat SHA256SUMS)
          BODY=$(python3 tools/release-body.py "$TAG")
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          ID=$(curl -sSf -X POST -H "Authorization: token $TOKEN" \
                 -H "Content-Type: application/json" -d "$BODY" "$API/releases" \
               | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for f in dist/*.flatpak dist/*.AppImage dist/SHA256SUMS; do
            echo "Uploading $(basename "$f")"
            curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" \
              "$API/releases/$ID/assets?name=$(basename "$f")" > /dev/null
          done
