# On a vX.Y.Z tag: build the Flatpak bundle and the AppImage, and publish a
# release with both, a SHA256SUMS file, and the CHANGELOG.md section of that
# version as release notes, on Forgejo and on the GitHub mirror (same files).
#
# Prepare the tag with tools/bump-version.py; see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  flatpak:
    runs-on: docker
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Build
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: tools/build-flatpak.sh dist

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: flatpak
          path: dist/

  appimage:
    runs-on: docker
    container:
      image: docker.io/library/golang:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq python3 file > /dev/null
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Check version consistency
        run: python3 tools/changelog.py check "${{ github.ref_name }}"

      - name: Build
        run: tools/build-appimage.sh dist

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: appimage
          path: dist/

  release:
    needs: [flatpak, appimage]
    runs-on: docker
    container:
      image: docker.io/library/golang:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq python3 > /dev/null
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: flatpak
          path: dist/
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: appimage
          path: dist/

      - name: Publish releases
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
          # Optional GitHub mirror release; skipped while the secret is unset.
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: ${{ vars.GH_REPO || 'alvaroemtnez/pat-desktop' }}
        run: |
          (cd dist && sha256sum *.flatpak *.AppImage > SHA256SUMS && cat SHA256SUMS)
          python3 tools/publish-release.py "${{ github.ref_name }}" \
            dist/*.flatpak dist/*.AppImage dist/SHA256SUMS
